# Label-budgeted estimation of accuracy by importance sampling (design D9). Cached predictions only.
seed: 0
trials: 1000
budgets: [25, 50, 100, 200, 400]   # labels drawn with replacement; every budget is smaller than every pool
epsilon: 0.1                       # weight of the uniform component: every sampling probability is positive
alpha: 1.0                         # q proportional to (1 - p_max)^alpha, the model's predicted uncertainty
alpha_sensitivity: [0.5, 1.0, 2.0]
