# Supervised XGBoost baseline on SageMaker (design D6).
pipeline_name: ciayn-xgb
stack_name: ciayn-baseline
operator_role: agentcore-workshop-role
# Tried in this order, without asking, until the German Credit execution completes.
instance_types: [ml.m5.xlarge, ml.m5.large, ml.m5.2xlarge, ml.c5.xlarge, ml.m4.xlarge, ml.c5.2xlarge]
regions: [us-east-2, us-east-1, us-west-2, eu-west-1]
probe_dataset: german
# SageMaker-owned image registries per region, and the image tags used
registries: {us-east-2: "257758044811", us-east-1: "683313688378", us-west-2: "246618743249", eu-west-1: "141502667606"}
images: {preprocess: "sagemaker-scikit-learn:1.4-2-py312-cpu-py3", train: "sagemaker-xgboost:3.0-5"}
max_runtime_s: {preprocess: 3600, train: 10800}
# A training job that waits this long for an instance is stopped and counted as refused (no capacity),
# so the next instance type or region is tried. Nothing is billed while a job waits.
capacity_wait_s: 900
volume_gb: 30
# On-demand list prices in USD per hour, used for the spending-limit check and the cost estimate, for
# every SageMaker job of the study. GPU prices: training-job prices in us-east-2 from AWS's public
# price file (pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonSageMaker/current/us-east-2/index.csv),
# read on 2026-09-30.
price_usd_per_hour: {ml.m5.large: 0.115, ml.m5.xlarge: 0.23, ml.m5.2xlarge: 0.461, ml.c5.xlarge: 0.204, ml.m4.xlarge: 0.24, ml.c5.2xlarge: 0.408,
                     ml.g5.xlarge: 1.2575, ml.g5.2xlarge: 1.515, ml.g5.12xlarge: 7.09, ml.g6e.xlarge: 2.61, ml.g6e.12xlarge: 13.12,
                     ml.g6.12xlarge: 5.752}   # the 12xlarge GPU prices are the same in us-east-1 and us-west-2 (read 2026-10-01)
region_price_factor: {us-east-2: 1.0, us-east-1: 1.0, us-west-2: 1.0, eu-west-1: 1.12}
# Model selection (validation only) and the learning curve
grid: {max_depth: [3, 6], eta: [0.1, 0.3]}
max_rounds: 500
patience: 30
fractions: [0.05, 0.1, 0.25, 0.5, 1.0]
# Text features are sparse TF-IDF weights: 16 histogram bins instead of XGBoost's default 256 make each
# boosting round several times faster at no measurable loss (checked on validation log-loss, never on test data).
text: {ngram_range: [1, 2], max_features: 50000, max_bin: 16}
curve_time_share: 0.8      # learning-curve fits are skipped, and recorded as skipped, once this share of the job's time limit is used
seed: 0
