AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Resources for the "Classification Is All You Need" SageMaker jobs (XGBoost, BERT and
  Qwen3.6-27B): one private bucket (job inputs and outputs, staged model weights), one
  SageMaker execution role, and one policy that lets the machine's existing role run the
  three ciayn pipelines. Deployable in any region; names carry the region because IAM names
  are account-wide. Remove with `python -m ciayn baseline teardown`.

Parameters:
  OperatorRoleName:
    Type: String
    Default: agentcore-workshop-role
    Description: Existing IAM role of the machine that starts the pipeline.

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ciayn-baseline-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-job-inputs, Status: Enabled, Prefix: input/, ExpirationInDays: 30}
          - {Id: expire-job-outputs, Status: Enabled, Prefix: output/, ExpirationInDays: 30}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ciayn-sagemaker-exec-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: sagemaker.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ciayn-baseline-jobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ProjectBucketObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
                Resource: !Sub '${Bucket.Arn}/*'
              - Sid: ProjectBucketList
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt Bucket.Arn
              - Sid: JobLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*'
              - Sid: JobMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
              - Sid: PullSageMakerImages
                Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage]
                Resource: '*'
              - Sid: PipelineStartsItsJobs
                Effect: Allow
                Action:
                  - sagemaker:CreateProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:CreateTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:AddTags
                  - sagemaker:ListTags
                Resource:
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:processing-job/pipelines-*'
                  - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/pipelines-*'
              - Sid: PassItselfToItsJobs
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/ciayn-sagemaker-exec-${AWS::Region}'
                Condition:
                  StringEquals: {'iam:PassedToService': sagemaker.amazonaws.com}

  OperatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ciayn-sagemaker-operator-${AWS::Region}'
      Description: Lets the machine's role run the ciayn SageMaker pipeline and read its jobs, logs and quotas.
      # (a managed policy's description cannot change without replacing the policy; the statement below names the three pipelines)
      Roles: [!Ref OperatorRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CiaynPipelines
            Effect: Allow
            Action:
              - sagemaker:CreatePipeline
              - sagemaker:UpdatePipeline
              - sagemaker:DeletePipeline
              - sagemaker:DescribePipeline
              - sagemaker:StartPipelineExecution
              - sagemaker:StopPipelineExecution
              - sagemaker:DescribePipelineExecution
              - sagemaker:DescribePipelineDefinitionForExecution
              - sagemaker:ListPipelineExecutions
              - sagemaker:ListPipelineExecutionSteps
              - sagemaker:AddTags
            Resource:
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-xgb'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-xgb/execution/*'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-bert'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-bert/execution/*'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-qwen'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:pipeline/ciayn-qwen/execution/*'
          - Sid: ReadPipelineJobs
            Effect: Allow
            Action: [sagemaker:DescribeProcessingJob, sagemaker:DescribeTrainingJob, sagemaker:StopProcessingJob, sagemaker:StopTrainingJob]
            Resource:
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:processing-job/pipelines-*'
              - !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:training-job/pipelines-*'
          - Sid: ListPipelines
            Effect: Allow
            Action: sagemaker:ListPipelines
            Resource: '*'
          - Sid: PassOnlyTheExecutionRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt ExecutionRole.Arn
            Condition:
              StringEquals: {'iam:PassedToService': sagemaker.amazonaws.com}
          - Sid: ReadQuotas
            Effect: Allow
            Action: [servicequotas:ListServiceQuotas, servicequotas:GetServiceQuota]
            Resource: '*'
          - Sid: ReadJobLogs
            Effect: Allow
            Action: [logs:GetLogEvents, logs:DescribeLogStreams, logs:FilterLogEvents]
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*'

Outputs:
  BucketName:
    Value: !Ref Bucket
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  OperatorPolicyArn:
    Value: !Ref OperatorPolicy
