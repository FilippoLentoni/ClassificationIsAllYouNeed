[project]
name = "ciayn"
version = "0.1.0"
description = "Classification Is All You Need: experiments and paper"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typesafe-sdk",
    "python-dotenv",
    "scikit-learn",
    "shap",
    "lime",
    "openml",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "datasets>=5.0.1",
    "boto3>=1.43.105",
]

[dependency-groups]
dev = [
    "pytest",
    "xgboost>=3.2.0",
    # CPU builds, only to test the BERT and Qwen job scripts offline with tiny models;
    # the jobs themselves run in AWS containers with their own versions.
    "torch>=2.9",
    "transformers>=5.3",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciayn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore:Linear regression equation is singular:UserWarning",
]
